name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:high
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm regression:fixtures
      - run: pnpm docs:build
      - run: pnpm pack:verify
      - run: pnpm smoke:bundle
      - run: node scripts/install-packed-cli.mjs
      - run: node scripts/release-smoke.mjs agentdocs
