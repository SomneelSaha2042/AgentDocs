name: Bug report
description: Report reproducible AgentDocs behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the AgentDocs beta.
  - type: input
    id: version
    attributes:
      label: AgentDocs version
      description: Output of `agentdocs --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: Include the command and a minimal redacted configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include errors or relevant generated output without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a small repository, fixture, or precise reproduction steps.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, tokens, and private documentation from this report.
          required: true
